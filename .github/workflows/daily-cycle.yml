name: Daily Lab Cycle

# 매일 새벽(한국 시간): AI 팀이 하루치 작업을 하고, LAB 사이트에 배포하고, 포스트를 준비한다.
# 시작: Claude 예약 작업이 03:52 KST 에 이 워크플로를 정시에 실행한다(workflow_dispatch).
#       GitHub 자체 예약(schedule)은 2~4시간씩 늦게 시작해서(06:20~10:11 기록) 예비용으로만 둔다.
# 발행: Claude 예약 작업이 07:40 에 daily/날짜/publish.json(그날 소설 회차)을 08:00 Metricool 예약 발행 (못 했으면 12:40 에 한 번 더).
# LIVE 반영은 promote-live.yml (의장 버튼).
on:
  schedule:
    - cron: "0 20 * * *"   # 예비: UTC 20:00 = KST 05:00 (실제 시작은 보통 더 늦음). 오늘 진짜 포스트가 이미 있으면 건너뜀
  workflow_dispatch: {}     # 정시 시작(Claude 예약 작업) + Actions 탭에서 수동 실행

permissions:
  contents: write
  id-token: write

concurrency:
  group: daily-cycle
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Check PAUSE switch
        id: pause
        run: |
          if [ -f PAUSE ]; then echo "paused=true" >> "$GITHUB_OUTPUT"; echo "PAUSE — 오늘은 쉼"; exit 0; fi
          # 예비 예약(schedule)은 새벽 정시 실행이 이미 진짜 포스트를 만들었으면 건너뛴다 (임시 포스트뿐이면 다시 시도)
          P="daily/$(date +%F)/post.json"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "$P" ] && ! grep -q '"auto_fallback": *true' "$P"; then
            echo "paused=true" >> "$GITHUB_OUTPUT"; echo "오늘 작업은 이미 끝남 — 예비 실행 건너뜀"; exit 0
          fi
          echo "paused=false" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.pause.outputs.paused == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        if: steps.pause.outputs.paused == 'false'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk libcairo2 > /dev/null
          pip install -q requests pillow cairosvg playwright
          python -m playwright install --with-deps chromium > /dev/null

      - name: Decide today (date, mode)
        if: steps.pause.outputs.paused == 'false'
        id: today
        run: |
          D=$(date +%F)
          PREV=$(find daily -mindepth 1 -maxdepth 1 -type d -name '20*' ! -name "$D" | wc -l)
          if [ "$(date +%u)" = "1" ] || [ "$PREV" = "0" ]; then MODE=meeting; else MODE=work; fi
          mkdir -p "daily/$D"
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "오늘: $D / 모드: $MODE"

      - name: Collect comments from recent posts
        if: steps.pause.outputs.paused == 'false'
        continue-on-error: true
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python scripts/fetch_feedback.py

      - name: Build today's prompt
        if: steps.pause.outputs.paused == 'false'
        run: |
          {
            echo "TODAY: ${{ steps.today.outputs.date }}"
            echo "MODE: ${{ steps.today.outputs.mode }}"
            echo
            cat scripts/daily_prompt.txt
          } > "$RUNNER_TEMP/prompt.txt"

      - name: Set up Node (Claude CLI)
        if: steps.pause.outputs.paused == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # claude-code-action@v1 이 exit code 2 로 실패해 CLI 직접 호출로 바꿈
      # (diag 로 CLI+토큰 정상 확인됨). Meta·Netlify 토큰·LAB 주소는 이 단계에 넘기지 않는다.
      # 예비 모델: 1차 sonnet(혼잡·사용 불가 시 haiku 로 자동 전환) → 빨리 실패하면 2분 뒤 haiku 로 한 번 더.
      # 단, 구독 사용 한도(5시간·주간)는 모든 모델이 함께 쓰므로 한도가 '다 찬' 경우엔 haiku 도 막힌다.
      # 결과(모델·종료 코드·오류 끝부분)는 daily/날짜/ai_run.md 에 남겨 다음 날 원인을 바로 볼 수 있게 한다.
      - name: Run AI team
        if: steps.pause.outputs.paused == 'false'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          D: ${{ steps.today.outputs.date }}
        run: |
          npm install -g @anthropic-ai/claude-code
          LOG="daily/$D/ai_run.md"
          echo "# AI 팀 실행 기록 ($D)" > "$LOG"
          run_team() {
            local model="$1" extra="$2" start rc
            start=$(date +%s)
            set +e
            cat "$RUNNER_TEMP/prompt.txt" | claude -p --model "$model" $extra --dangerously-skip-permissions 2> "$RUNNER_TEMP/err.txt"
            rc=$?
            set -e
            local mins=$(( ($(date +%s) - start) / 60 ))
            {
              echo
              echo "- $(date '+%H:%M') 모델: $model ${extra:+($extra)} / 종료 코드: $rc / ${mins}분"
              if [ "$rc" != "0" ]; then
                echo '```'
                tail -n 30 "$RUNNER_TEMP/err.txt" | sed -E 's/(sk-ant-|nfp_)[A-Za-z0-9_-]+/\1REDACTED/g'
                echo '```'
              fi
            } >> "$LOG"
            LAST_MINS=$mins
            return $rc
          }
          if run_team sonnet "--fallback-model haiku"; then exit 0; fi
          if [ "$LAST_MINS" -lt 20 ]; then
            echo "1차 실패 — 2분 뒤 예비 모델(haiku)로 다시 시도"
            sleep 120
            run_team haiku "" && { echo "- 예비 모델로 완료" >> "$LOG"; exit 0; }
          fi
          echo "- AI 팀 실행 실패 (임시 포스트로 대체됨)" >> "$LOG"
          exit 1

      - name: Check app health (for tomorrow's PM)
        if: steps.pause.outputs.paused == 'false'
        run: python scripts/check_app.py --report "daily/${{ steps.today.outputs.date }}/lab_status.md"

      - name: Build LAB version (swap backend, block payment, add banner)
        if: steps.pause.outputs.paused == 'false'
        id: lab
        continue-on-error: true
        env:
          LAB_APPS_SCRIPT_URL: ${{ secrets.LAB_APPS_SCRIPT_URL }}
        run: python scripts/build_lab.py

      - name: Screenshot LAB (mobile)
        if: steps.pause.outputs.paused == 'false' && steps.lab.outcome == 'success'
        continue-on-error: true
        run: python scripts/screenshot.py

      - name: Prepare hero image
        if: steps.pause.outputs.paused == 'false'
        run: python scripts/prepare_hero.py

      - name: Deploy to LAB site
        if: steps.pause.outputs.paused == 'false'
        id: deploy
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_LAB_SITE_ID: ${{ secrets.NETLIFY_LAB_SITE_ID }}
        run: |
          if [ "${{ steps.lab.outcome }}" != "success" ]; then echo "result=no-build" >> "$GITHUB_OUTPUT"; echo "LAB 빌드 없음 — 배포 안 함"; exit 0; fi
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_LAB_SITE_ID" ]; then echo "result=skipped" >> "$GITHUB_OUTPUT"; echo "Netlify 설정 없음 — LAB 배포 건너뜀"; exit 0; fi
          if npx -y netlify-cli@latest deploy --dir=build/lab --prod \
               --site="$NETLIFY_LAB_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN" \
               --message="LAB ${{ steps.today.outputs.date }}"; then
            echo "result=deployed" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi

      # 디플로이 픽션 — 오늘 회차 끝에 실제 배포 결과를 도장으로 찍는다
      - name: Stamp today's episode with the real deploy result
        if: steps.pause.outputs.paused == 'false'
        continue-on-error: true
        env:
          DEPLOY_RESULT: ${{ steps.deploy.outputs.result }}
          MODE: ${{ steps.today.outputs.mode }}
        run: python scripts/stamp_episode.py

      # 2026-10-23 의장 결정: 공개되는 것은 디플로이 픽션 회차. 표지·인스타 판·페이스북 전문을 daily/날짜/publish.json 으로 묶는다
      - name: Prepare today's novel for SNS
        if: steps.pause.outputs.paused == 'false'
        continue-on-error: true
        run: python scripts/prepare_novel_post.py

      - name: Commit today's work
        if: steps.pause.outputs.paused == 'false'
        run: |
          git config user.name "ownstreet-ai-team"
          git config user.email "ai-team@users.noreply.github.com"
          git add -A
          git commit -m "Day ${{ steps.today.outputs.date }} (${{ steps.today.outputs.mode }})" || echo "변경 없음"
          git push
