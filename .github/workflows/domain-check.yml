name: Domain Check
# 임시 점검: ownstreet.team 연결 상태(DNS·https 인증서·화면)를 확인해 주석(annotation)으로 남긴다.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check ownstreet.team
        run: |
          for h in ownstreet-lab.netlify.app ownstreet.team www.ownstreet.team; do
            echo "::notice title=DNS $h::A=$(dig +short A $h | tr '\n' ' ') | CNAME=$(dig +short CNAME $h | tr '\n' ' ') | AAAA=$(dig +short AAAA $h | tr '\n' ' ')"
            for proto in https http; do
              out=$(curl -sS -o /tmp/body -m 20 -w 'code=%{http_code} redirect=%{redirect_url} ssl_verify=%{ssl_verify_result}' "$proto://$h/" 2>&1 | tr '\n' ' ')
              title=$(grep -o '<title>[^<]*' /tmp/body 2>/dev/null | head -1 | sed 's/<title>//')
              banner=$(grep -c 'LAB 미리보기' /tmp/body 2>/dev/null || true)
              echo "::notice title=$proto://$h::$out | title=$title | banner=$banner"
            done
            cert=$(echo | timeout 10 openssl s_client -servername $h -connect $h:443 2>/dev/null | openssl x509 -noout -subject -issuer -enddate 2>&1 | tr '\n' ' ')
            echo "::notice title=CERT $h::$cert"
          done
          echo "::notice title=NS::$(dig +short NS ownstreet.team | tr '\n' ' ')"
