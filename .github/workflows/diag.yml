name: Claude Diag

# 임시 점검용. AI 팀 호출이 왜 실패하는지 실제 오류를 파일로 남긴다.
# 토큰 값은 파일에 남기지 않도록 마지막에 가린다.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Test Claude call (capture error)
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p checks
          {
            echo "=== version ==="
            claude --version 2>&1 || echo "version rc=$?"
            echo
            echo "=== print mode call ==="
            claude -p "Reply with just: OK" --model sonnet 2>&1
            echo "call rc=$?"
          } > checks/claude-diag.txt 2>&1 || true
          # 혹시라도 토큰 비슷한 문자열이 찍혔으면 가린다
          sed -i -E 's/sk-ant-[A-Za-z0-9_-]+/sk-ant-REDACTED/g' checks/claude-diag.txt
          echo "---- 결과 ----"
          cat checks/claude-diag.txt

      - name: Commit diag
        run: |
          git config user.name "ownstreet-ai-team"
          git config user.email "ai-team@users.noreply.github.com"
          git add checks/claude-diag.txt
          git commit -m "diag: claude CLI 호출 점검 결과" || echo "변경 없음"
          git push
