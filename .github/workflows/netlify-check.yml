name: Netlify 상태 확인 (진단용)

# LAB 배포가 Forbidden 으로 실패할 때 원인을 보려고 만든 일회성 진단. 비밀값은 출력하지 않는다.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Netlify API 응답 확인
        env:
          T: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          S: ${{ secrets.NETLIFY_LAB_SITE_ID }}
        run: |
          H="Authorization: Bearer $T"
          echo "== 계정 키 목록 =="
          curl -s -H "$H" https://api.netlify.com/api/v1/accounts > a.json
          jq -r '.[] | keys | join(", ")' a.json
          jq -c '.[] | {slug, type_name, billing_period, current_billing_period_start, next_billing_period_start, capabilities}' a.json
          echo "== 이 토큰으로 보이는 모든 사이트 =="
          curl -s -H "$H" "https://api.netlify.com/api/v1/sites?per_page=100" | jq -r '.[] | "\(.name) | \(.url) | state=\(.state) | account=\(.account_slug) | disabled=\(.disabled // false)"'
          echo "== LAB 사이트 전체 키 중 상태 관련 =="
          curl -s -H "$H" "https://api.netlify.com/api/v1/sites/$S" | jq -c '{state, disabled, suspended: .suspended, paused: .paused, build_settings_stopped: .build_settings.stop_builds, published_deploy_at: .published_deploy.published_at}'
          echo "== 이번 달 모든 사이트 배포 수 =="
          for id in $(curl -s -H "$H" "https://api.netlify.com/api/v1/sites?per_page=100" | jq -r '.[].id'); do
            curl -s -H "$H" "https://api.netlify.com/api/v1/sites/$id/deploys?per_page=100" | jq -r --arg id "$id" '[.[] | select(.created_at >= "2026-11-01")] | "\(.[0].name // $id): 11월 \(length)건 (prod \([.[]|select(.context=="production")]|length))"'
          done
          echo "== 시험 배포 생성 (파일 없이 draft, 응답만 확인) =="
          curl -s -o d.json -w "HTTP %{http_code}\n" -X POST -H "$H" -H "Content-Type: application/json" -d '{"files":{},"draft":true}' "https://api.netlify.com/api/v1/sites/$S/deploys"
          jq -c '{code, message, state, error_message}' d.json 2>/dev/null || head -c 400 d.json
