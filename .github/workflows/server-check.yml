name: Server Check
# 임시 점검: LIVE 반영 전에 실제 서비스 접수 서버(공개 주소)가 새 채팅 화면이 요구하는 버전인지 본다. 버전·준비 상태만 남긴다.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check LIVE server
        run: |
          URL=$(grep -o "https://script.google.com/macros/s/[^']*/exec" app/config.js | head -1)
          body=$(curl -sSL -m 30 "$URL" || true)
          info=$(echo "$body" | jq -c '{version, ready, storage}' 2>/dev/null || echo "not-json: $(echo "$body" | head -c 120 | tr '\n' ' ')")
          echo "::notice title=LIVE server::$info"
