name: Morning Publish

# 발행 경로를 Metricool 로 옮김(2026-10-18). 이 Meta 직접 발행은 자동 실행하지 않는다.
# 매일 발행은 Claude 쪽 예약 작업이 Metricool 로 처리한다(열쇠 추가 불필요).
# 수동으로 돌려보고 싶을 때만 Actions 에서 실행(META 비밀값이 있어야 동작).
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -q requests

      - name: Publish to Instagram & Facebook
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
        run: python scripts/publish_post.py

      - name: Save post IDs (for tomorrow's comment collection)
        if: always()
        run: |
          git config user.name "ownstreet-ai-team"
          git config user.email "ai-team@users.noreply.github.com"
          git add daily/
          git commit -m "Published $(date +%F)" || echo "변경 없음"
          git push
